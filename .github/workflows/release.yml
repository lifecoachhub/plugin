name: Release

# Publishing a GitHub Release (tag = plugin version, e.g. 0.2.1) builds the plugin,
# deploys it to WordPress.org SVN and attaches the zip to the release.
# Run it manually from the Actions tab to build and do an SVN dry run without releasing.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions match
        id: version
        run: |
          header=$(grep -m1 -E '^\s*\*\s*Version:' lifecoachhub.php | awk '{print $NF}')
          constant=$(grep -m1 "define( 'LIFECOACHHUB_VERSION'" lifecoachhub.php | sed -E "s/.*'([0-9][^']*)'.*/\1/")
          stable=$(grep -m1 -E '^Stable tag:' readme.txt | awk '{print $NF}')
          package=$(node -p "require('./package.json').version")

          if [ "${{ github.event_name }}" = "release" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected="$header"
          fi

          echo "Expected: $expected | header: $header | constant: $constant | stable tag: $stable | package.json: $package"
          for value in "$header" "$constant" "$stable" "$package"; do
            if [ "$value" != "$expected" ]; then
              echo "::error::Version mismatch. Update lifecoachhub.php (header and LIFECOACHHUB_VERSION), readme.txt Stable tag and package.json to $expected."
              exit 1
            fi
          done
          echo "version=$expected" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer:v2

      - name: Composer install (production autoloader)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Create plugin zip
        run: |
          npm run plugin-zip
          rm -rf dist && mkdir dist
          unzip -q lifecoachhub.zip -d dist
          test -f dist/lifecoachhub/lifecoachhub.php

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name != 'release' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: lifecoachhub
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_DIR: dist/lifecoachhub
          ASSETS_DIR: .wordpress-org

      - name: Attach zip to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" lifecoachhub.zip --clobber

      - name: Keep the zip as a build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: lifecoachhub-${{ steps.version.outputs.version }}
          path: dist/lifecoachhub
